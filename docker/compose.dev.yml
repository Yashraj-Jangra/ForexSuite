services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vaultbill
      POSTGRES_PASSWORD: vaultbill_dev
      POSTGRES_DB: vaultbill
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultbill"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9004"
    environment:
      MINIO_ROOT_USER: vaultbill_admin
      MINIO_ROOT_PASSWORD: vaultbill_minio_dev
    ports:
      - "9003:9000"
      - "9004:9004"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  redis_data:
  minio_data: