<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981" stop-opacity="0.04"/><stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/></linearGradient></defs>
  <rect width="400" height="300" rx="20" fill="url(#bg)"/>
  <!-- plant pot -->
  <path d="M170 230 L180 190 L220 190 L230 230 Z" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.15" stroke-width="1"/>
  <rect x="160" y="225" width="80" height="8" rx="3" fill="#10b981" fill-opacity="0.12"/>
  <!-- plant stem -->
  <path d="M200 190 L200 130" stroke="#10b981" stroke-width="3" stroke-opacity="0.2" stroke-linecap="round"/>
  <!-- leaves -->
  <ellipse cx="185" cy="160" rx="15" ry="8" fill="#10b981" fill-opacity="0.12" transform="rotate(-30 185 160)"/>
  <ellipse cx="215" cy="150" rx="15" ry="8" fill="#10b981" fill-opacity="0.15" transform="rotate(25 215 150)"/>
  <ellipse cx="190" cy="135" rx="12" ry="7" fill="#10b981" fill-opacity="0.1" transform="rotate(-20 190 135)"/>
  <!-- chart bars -->
  <rect x="290" y="170" width="15" height="50" rx="3" fill="#10b981" fill-opacity="0.15"/>
  <rect x="312" y="145" width="15" height="75" rx="3" fill="#10b981" fill-opacity="0.2"/>
  <rect x="334" y="120" width="15" height="100" rx="3" fill="#10b981" fill-opacity="0.25"/>
  <!-- trend arrow -->
  <path d="M300 170 L290 140 L280 150" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.35" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="275,145 280,150 285,142" stroke="#10b981" stroke-width="2" stroke-opacity="0.35" fill="none" stroke-linecap="round"/>
</svg>