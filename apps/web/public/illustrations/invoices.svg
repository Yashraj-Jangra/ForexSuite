<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed" stop-opacity="0.04"/><stop offset="100%" stop-color="#7c3aed" stop-opacity="0.1"/></linearGradient></defs>
  <rect width="400" height="300" rx="20" fill="url(#bg)"/>
  <!-- document -->
  <rect x="110" y="50" width="180" height="200" rx="10" fill="white" fill-opacity="0.08" stroke="#7c3aed" stroke-opacity="0.2" stroke-width="1"/>
  <!-- header -->
  <rect x="135" y="70" width="130" height="20" rx="4" fill="#7c3aed" fill-opacity="0.3"/>
  <rect x="135" y="100" width="90" height="6" rx="3" fill="#7c3aed" fill-opacity="0.12"/>
  <rect x="135" y="114" width="70" height="6" rx="3" fill="#7c3aed" fill-opacity="0.1"/>
  <!-- invoice number -->
  <rect x="230" y="100" width="40" height="6" rx="3" fill="#7c3aed" fill-opacity="0.08"/>
  <!-- table header -->
  <rect x="135" y="140" width="130" height="6" rx="3" fill="#7c3aed" fill-opacity="0.15"/>
  <!-- rows -->
  <rect x="135" y="158" width="130" height="4" rx="2" fill="#7c3aed" fill-opacity="0.08"/>
  <rect x="135" y="170" width="100" height="4" rx="2" fill="#7c3aed" fill-opacity="0.06"/>
  <rect x="135" y="182" width="120" height="4" rx="2" fill="#7c3aed" fill-opacity="0.06"/>
  <!-- totals -->
  <rect x="135" y="205" width="60" height="4" rx="2" fill="#7c3aed" fill-opacity="0.1"/>
  <rect x="135" y="216" width="50" height="6" rx="3" fill="#7c3aed" fill-opacity="0.20"/>
  <!-- floating elements -->
  <rect x="320" y="80" width="30" height="30" rx="6" fill="#7c3aed" fill-opacity="0.12" transform="rotate(-10 335 95)"/>
  <text x="328" y="101" font-size="10" fill="#7c3aed" font-family="sans-serif" opacity="0.5" font-weight="bold">₹</text>
</svg>