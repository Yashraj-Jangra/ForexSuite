<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#06b6d4" stop-opacity="0.04"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/></linearGradient></defs>
  <rect width="400" height="300" rx="20" fill="url(#bg)"/>
  <!-- globe -->
  <circle cx="200" cy="145" r="65" fill="#06b6d4" fill-opacity="0.06" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="2"/>
  <!-- continents -->
  <ellipse cx="190" cy="130" rx="30" ry="20" fill="#06b6d4" fill-opacity="0.08"/>
  <ellipse cx="215" cy="160" rx="20" ry="25" fill="#06b6d4" fill-opacity="0.06"/>
  <!-- grid lines -->
  <line x1="135" y1="145" x2="265" y2="145" stroke="#06b6d4" stroke-width="0.8" stroke-opacity="0.1"/>
  <line x1="200" y1="80" x2="200" y2="210" stroke="#06b6d4" stroke-width="0.8" stroke-opacity="0.1"/>
  <ellipse cx="200" cy="145" rx="65" ry="25" fill="none" stroke="#06b6d4" stroke-width="0.8" stroke-opacity="0.08"/>
  <!-- connection dots -->
  <circle cx="120" cy="95" r="4" fill="#06b6d4" opacity="0.15"/>
  <circle cx="280" cy="100" r="3" fill="#06b6d4" opacity="0.12"/>
  <circle cx="300" cy="200" r="4" fill="#06b6d4" opacity="0.15"/>
  <line x1="139" y1="97" x2="165" y2="115" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="3 2"/>
  <line x1="262" y1="103" x2="235" y2="120" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="3 2"/>
</svg>