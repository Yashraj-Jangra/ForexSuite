<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6c63ff" stop-opacity="0.06"/><stop offset="100%" stop-color="#6c63ff" stop-opacity="0.12"/></linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#hbg)"/>
  <!-- desk -->
  <rect x="60" y="180" width="280" height="12" rx="6" fill="#6c63ff" fill-opacity="0.15"/>
  <rect x="100" y="192" width="16" height="70" rx="4" fill="#6c63ff" fill-opacity="0.1"/>
  <rect x="280" y="192" width="16" height="70" rx="4" fill="#6c63ff" fill-opacity="0.1"/>
  <!-- laptop -->
  <rect x="130" y="120" width="140" height="60" rx="8" fill="#6c63ff" fill-opacity="0.2"/>
  <rect x="145" y="128" width="110" height="44" rx="4" fill="#1a1a2e"/>
  <!-- invoice on screen -->
  <rect x="160" y="136" width="80" height="4" rx="2" fill="#6c63ff" fill-opacity="0.6"/>
  <rect x="160" y="145" width="60" height="3" rx="1.5" fill="#6c63ff" fill-opacity="0.3"/>
  <rect x="160" y="153" width="50" height="3" rx="1.5" fill="#6c63ff" fill-opacity="0.3"/>
  <rect x="160" y="161" width="40" height="3" rx="1.5" fill="#22c55e" fill-opacity="0.5"/>
  <!-- floating currency symbols -->
  <text x="55" y="90" font-size="20" font-family="sans-serif" fill="#f59e0b" font-weight="bold" opacity="0.6">$</text>
  <text x="320" y="80" font-size="18" font-family="sans-serif" fill="#3b82f6" font-weight="bold" opacity="0.6">€</text>
  <text x="340" y="150" font-size="22" font-family="sans-serif" fill="#22c55e" font-weight="bold" opacity="0.5">₹</text>
  <text x="30" y="160" font-size="16" font-family="sans-serif" fill="#8b5cf6" font-weight="bold" opacity="0.5">¥</text>
  <!-- person silhouette -->
  <circle cx="200" cy="85" r="20" fill="#6c63ff" fill-opacity="0.25"/>
  <path d="M165 130 Q165 100 200 100 Q235 100 235 130 L235 140 L165 140 Z" fill="#6c63ff" fill-opacity="0.25"/>
</svg>